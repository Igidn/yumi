name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check main
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Type-check renderer
        run: npx tsc -p tsconfig.renderer.json --noEmit

      - run: npm run build
